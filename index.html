<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karateka JS Port</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        font-family: monospace;
      }

      #screen {
        border: 2px solid #666;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="280" height="192" aria-label="Karateka screen"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
